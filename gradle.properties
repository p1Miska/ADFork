# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric toolchain (verified for 1.21.11 as of Aug 2026)
minecraft_version=1.21.11
loader_version=0.18.1
loom_version=1.14.+
fabric_version=0.141.1+1.21.11

# Yarn mappings (stable/proven for 1.21.11 - official Mojang-only mappings
# only start at Minecraft 26.1, and the current Loom release has a known bug
# resolving loom.officialMojangMappings() for 1.21.11, so Yarn is the
# reliable choice here)
yarn_mappings=1.21.11+build.4

# Mod properties
mod_version=1.0.0
maven_group=com.trollmods
archives_base_name=adgif
mod_id=adgif
